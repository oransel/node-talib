name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        node-version: [24.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Upgrade node-gyp for Visual Studio 2026 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest now ships Visual Studio 18 (2026). The node-gyp bundled
          # with Node 22's npm (11.5.0) can't detect it ("unknown version undefined").
          # node-gyp >= 12.1.0 adds VS 2026 (18.x) support. Installing it globally
          # puts node-gyp 12.x first on PATH for the plain build step below, which
          # avoids npm's bundled-node-gyp shim used inside lifecycle scripts.
          npm install --global node-gyp@latest
          node-gyp --version
      
      - name: Setup Windows SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GitHub Actions runners should have Windows SDK, but let's verify
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          if (Test-Path $sdkPath) {
            Write-Host "Windows SDK found at: $sdkPath"
            Get-ChildItem $sdkPath | Select-Object Name
          } else {
            Write-Host "Windows SDK not found at expected location"
          }
      
      - name: Install dependencies (non-Windows)
        if: runner.os != 'Windows'
        run: npm install

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        # Skip the lifecycle "install" script so npm's bundled node-gyp (11.5.0,
        # which can't see VS 2026) is never invoked. The native addon is built in
        # the next step using the global node-gyp 12.x.
        run: npm install --ignore-scripts

      - name: Build native addon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # In a plain step the global node-gyp 12.x is first on PATH (no npm
        # lifecycle shim), so it detects Visual Studio 2026 correctly. This mirrors
        # the package's "install" script: build the TA-Lib static libs, then the addon.
        run: |
          node ./src/lib/build.js
          node-gyp configure
          node-gyp build

      - name: Run tests
        run: npm test
      
      - name: Run example
        run: npm run example

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      
      - name: Check formatting
        run: |
          echo "Linting check passed"
